name: Build and test

on:
  # Branches only: a v* tag runs release.yml, which calls this workflow before packaging.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux text-rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libfreetype6 fonts-dejavu-core
      - run: dotnet restore Wandur.sln --locked-mode
      - run: dotnet build Wandur.sln -c Release --no-restore
      - run: dotnet test Wandur.sln -c Release --no-build --no-restore
